<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administração — Barbearias</title>
<style>
  :root {
    --bg:#eef0f4; --bg2:#e4e7ee; --card:#ffffff; --txt:#16181d; --mut:#6b7280; --bd:#dcdfe6;
    --input:#f7f8fa;
    --pri:#2f6df6; --pri-l:#5b8cff; --pri-d:#1b44a8;
    --sec:#ffffff; --sec-d:#c3c8d2; --sec-txt:#2b2f38;
    --ok:#1a7f37; --ok-bg:#e3f6e8; --err:#c62828; --err-bg:#fdeaea;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
    --head1:#1a1d24; --head2:#2a2f3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --bg2:#14171c; --card:#1a1d24; --txt:#e8eaed; --mut:#9aa0aa; --bd:#2c313b;
      --input:#12151a;
      --pri:#3b7bff; --pri-l:#6a97ff; --pri-d:#1a3f9c;
      --sec:#262b34; --sec-d:#0e1014; --sec-txt:#e8eaed;
      --ok:#3fb950; --ok-bg:#12301b; --err:#ff6b6b; --err-bg:#3a1717;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
      --head1:#0b0d10; --head2:#1a1d24;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
  }

  /* ---------- cabeçalho ---------- */
  .header {
    background: linear-gradient(135deg, var(--head1), var(--head2));
    color:#fff; box-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  .header-in {
    max-width:1040px; margin:0 auto; padding:16px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-ico {
    width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:linear-gradient(180deg,var(--pri-l),var(--pri)); box-shadow:0 3px 0 var(--pri-d), 0 6px 12px rgba(0,0,0,.3);
    font-size:20px;
  }
  .brand h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.2px; }
  .brand small { display:block; color:#aab1bd; font-size:12px; margin-top:2px; }

  main { max-width:1040px; margin:0 auto; padding:22px 16px 70px; }
  h2 { font-size:16px; margin:0 0 14px; font-weight:700; display:flex; align-items:center; gap:8px; }

  /* ---------- cartões ---------- */
  .card {
    background:var(--card); border:1px solid var(--bd); border-radius:14px;
    padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
  }

  /* ---------- formulário ---------- */
  label { display:block; font-size:12px; font-weight:600; color:var(--mut); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; }
  input {
    width:100%; padding:11px 12px; border:1px solid var(--bd); border-radius:10px;
    background:var(--input); color:var(--txt); font-size:14px; outline:none;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.06); transition:border-color .15s, box-shadow .15s;
  }
  input:focus { border-color:var(--pri); box-shadow: inset 0 2px 3px rgba(0,0,0,.06), 0 0 0 3px rgba(47,109,246,.2); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px; }

  /* ---------- botões 3D ---------- */
  button {
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; color:#fff;
    padding:11px 22px; border:0; border-radius:10px; position:relative;
    background:linear-gradient(180deg, var(--pri-l), var(--pri));
    box-shadow: 0 5px 0 var(--pri-d), 0 9px 14px rgba(27,68,168,.3), inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow:0 1px 0 rgba(0,0,0,.25);
    transition: transform .08s ease, box-shadow .08s ease, filter .15s;
    margin-bottom:5px;
  }
  button:hover { filter:brightness(1.07); transform:translateY(-1px);
    box-shadow: 0 6px 0 var(--pri-d), 0 12px 18px rgba(27,68,168,.32), inset 0 1px 0 rgba(255,255,255,.35); }
  button:active { transform:translateY(4px);
    box-shadow: 0 1px 0 var(--pri-d), 0 2px 4px rgba(27,68,168,.3), inset 0 1px 0 rgba(255,255,255,.2); }
  button:focus-visible { outline:3px solid rgba(47,109,246,.45); outline-offset:2px; }
  button:disabled { opacity:.6; cursor:wait; transform:translateY(3px); box-shadow:0 2px 0 var(--pri-d); }

  button.sec {
    color:var(--sec-txt); text-shadow:none;
    background:linear-gradient(180deg, var(--sec), var(--sec));
    border:1px solid var(--bd);
    box-shadow: 0 4px 0 var(--sec-d), 0 7px 10px rgba(16,24,40,.1), inset 0 1px 0 rgba(255,255,255,.5);
  }
  button.sec:hover { box-shadow: 0 5px 0 var(--sec-d), 0 10px 14px rgba(16,24,40,.12), inset 0 1px 0 rgba(255,255,255,.5); }
  button.sec:active { transform:translateY(3px); box-shadow: 0 1px 0 var(--sec-d), 0 2px 3px rgba(16,24,40,.1); }
  .topo button.sec { background:linear-gradient(180deg,#3a4050,#2b303b); color:#fff; border:0;
    box-shadow:0 4px 0 #14171d, 0 7px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15); }
  .topo button.sec:active { box-shadow:0 1px 0 #14171d; }

  button.pequeno { padding:6px 12px; font-size:12.5px; border-radius:8px; margin-bottom:3px;
    box-shadow: 0 3px 0 var(--sec-d), 0 5px 8px rgba(16,24,40,.1), inset 0 1px 0 rgba(255,255,255,.5); }
  button.pequeno:hover { box-shadow: 0 4px 0 var(--sec-d), 0 7px 10px rgba(16,24,40,.12), inset 0 1px 0 rgba(255,255,255,.5); }
  button.pequeno:active { transform:translateY(2px); box-shadow: 0 1px 0 var(--sec-d); }
  button.pequeno.pri { color:#fff; border:0; background:linear-gradient(180deg, var(--pri-l), var(--pri)); text-shadow:0 1px 0 rgba(0,0,0,.25);
    box-shadow: 0 3px 0 var(--pri-d), 0 5px 8px rgba(27,68,168,.25), inset 0 1px 0 rgba(255,255,255,.35); }
  button.pequeno.pri:hover { box-shadow: 0 4px 0 var(--pri-d), 0 7px 10px rgba(27,68,168,.3), inset 0 1px 0 rgba(255,255,255,.35); }
  button.pequeno.pri:active { box-shadow: 0 1px 0 var(--pri-d); }

  /* ---------- mensagens ---------- */
  .msg { margin-top:14px; font-size:14px; word-break:break-all; border-radius:10px; }
  .msg:empty { display:none; }
  .msg.ok  { color:var(--ok);  background:var(--ok-bg);  padding:10px 12px; }
  .msg.err { color:var(--err); background:var(--err-bg); padding:10px 12px; }

  /* ---------- resumo ---------- */
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat b { display:block; font-size:26px; line-height:1.1; }
  .stat span { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; font-weight:600; }
  .stat.ok b { color:var(--ok); } .stat.x b { color:var(--err); }

  /* ---------- tabela ---------- */
  .tabela { overflow-x:auto; border:1px solid var(--bd); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--bd); vertical-align:middle; }
  th { font-size:11.5px; color:var(--mut); font-weight:700; text-transform:uppercase; letter-spacing:.5px; background:var(--input); }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:var(--input); }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .venc-ok { color:var(--ok); background:var(--ok-bg); }
  .venc-x  { color:var(--err); background:var(--err-bg); }
  .data { display:block; font-size:12px; color:var(--mut); margin-top:4px; }
  .acoes { display:flex; gap:8px; flex-wrap:wrap; }
  .mut { color:var(--mut); font-size:13px; }

  /* ---------- login ---------- */
  #login { max-width:400px; margin:70px auto; padding:28px; }
  #login .brand { margin-bottom:22px; }
  #login .brand h1 { color:var(--txt); }
  #login .brand small { color:var(--mut); }
  #login button { width:100%; margin-top:6px; }
  .oculto { display:none; }

  @media (max-width:560px) {
    .stats { grid-template-columns:1fr; }
    .header-in { padding:12px; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <section id="login" class="card">
    <div class="brand">
      <div class="brand-ico">✂️</div>
      <div><h1>Administração</h1><small>Acesso restrito</small></div>
    </div>
    <div style="margin-bottom:16px"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div style="margin-bottom:16px"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password"></div>
    <button id="btnEntrar">Entrar</button>
    <div id="lMsg" class="msg err"></div>
  </section>

  <!-- PAINEL -->
  <section id="painel" class="oculto">
    <header class="header">
      <div class="header-in topo">
        <div class="brand">
          <div class="brand-ico">✂️</div>
          <div><h1>Barbearias</h1><small>Painel de administração</small></div>
        </div>
        <button class="sec" id="btnSair">Sair</button>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>Cadastradas</span></div>
        <div class="stat ok"><b id="stAtivas">0</b><span>Em dia</span></div>
        <div class="stat x"><b id="stVencidas">0</b><span>Vencidas</span></div>
      </div>

      <div class="card">
        <h2>➕ Cadastrar nova barbearia</h2>
        <div class="grid">
          <div><label for="cNome">Nome da barbearia</label><input id="cNome" maxlength="80"></div>
          <div><label for="cEmail">E-mail de login</label><input id="cEmail" type="email"></div>
          <div><label for="cSenha">Senha (mín. 6)</label><input id="cSenha" type="text" autocomplete="off"></div>
          <div><label for="cLogo">Link do logo (https, opcional)</label><input id="cLogo" type="url" placeholder="https://..."></div>
          <div><label for="cDias">Dias de teste</label><input id="cDias" type="number" min="0" max="365" value="7"></div>
        </div>
        <div style="margin-top:18px"><button id="btnCadastrar">Cadastrar</button></div>
        <div id="cMsg" class="msg"></div>
      </div>

      <div class="card">
        <h2>💈 Barbearias cadastradas</h2>
        <div class="tabela">
          <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Vencimento</th><th>Link</th><th></th></tr></thead>
            <tbody id="lista"><tr><td colspan="5" class="mut">Carregando…</td></tr></tbody>
          </table>
        </div>
        <div id="lMsg2" class="msg"></div>
      </div>
    </main>
  </section>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
// COLE AQUI a mesma configuração web do Firebase que já está no seu public/index.html
const firebaseConfig = {
  apiKey: "COLE_AQUI_A_API_KEY",
  authDomain: "barbearia-d51ac.firebaseapp.com",
  projectId: "barbearia-d51ac"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API = '/.netlify/functions/admin-barbearias';
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function msg(el, texto, ok) { el.textContent = texto || ''; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

async function chamar(metodo, corpo) {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(API, {
    method: metodo,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || 'Erro ' + r.status);
  return dados;
}

// ---------- login ----------
$('btnEntrar').onclick = async () => {
  const b = $('btnEntrar'); b.disabled = true; msg($('lMsg'), '');
  try {
    await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lSenha').value);
  } catch (e) {
    msg($('lMsg'), 'E-mail ou senha incorretos.');
  }
  b.disabled = false;
};
$('lSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnEntrar').click(); });
$('btnSair').onclick = () => auth.signOut();

auth.onAuthStateChanged(async (u) => {
  if (!u) { $('painel').classList.add('oculto'); $('login').classList.remove('oculto'); return; }
  try {
    await carregar();
    $('login').classList.add('oculto'); $('painel').classList.remove('oculto');
  } catch (e) {
    await auth.signOut();
    msg($('lMsg'), e.message === 'Acesso negado.' ? 'Esta conta não tem acesso à administração.' : e.message);
  }
});

// ---------- lista ----------
function hoje() { return new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10); }

function dataBR(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '—';
}

async function carregar() {
  const { barbearias } = await chamar('GET');
  const tb = $('lista');
  const h = hoje();
  const vencidasN = barbearias.filter((b) => !b.vencimento || b.vencimento < h).length;
  $('stTotal').textContent = barbearias.length;
  $('stVencidas').textContent = vencidasN;
  $('stAtivas').textContent = barbearias.length - vencidasN;

  if (!barbearias.length) { tb.innerHTML = '<tr><td colspan="5" class="mut">Nenhuma barbearia cadastrada.</td></tr>'; return; }
  tb.innerHTML = barbearias.map((b) => {
    const vencida = !b.vencimento || b.vencimento < h;
    const link = b.slug ? location.origin + '/agenda.html?b=' + b.slug : '';
    return `<tr data-id="${esc(b.id)}">
      <td><strong>${esc(b.nome)}</strong></td>
      <td>${esc(b.email)}</td>
      <td><span class="badge ${vencida ? 'venc-x' : 'venc-ok'}">${vencida ? 'Vencida' : 'Em dia'}</span><span class="data">${esc(dataBR(b.vencimento))}</span></td>
      <td>${link ? `<button class="sec pequeno copiar" data-link="${esc(link)}">Copiar</button>` : '<span class="mut">sem slug</span>'}</td>
      <td class="acoes">
        <button class="pequeno pri editar">Editar</button>
      </td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('.copiar').forEach((btn) => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(btn.dataset.link); btn.textContent = 'Copiado!'; }
      catch (e) { prompt('Copie o link:', btn.dataset.link); }
      setTimeout(() => (btn.textContent = 'Copiar'), 1500);
    };
  });
  tb.querySelectorAll('.editar').forEach((btn) => {
    btn.onclick = () => {
      const id = btn.closest('tr').dataset.id;
      editar(barbearias.find((x) => x.id === id));
    };
  });
}

// Edição simples por caixas de diálogo
async function editar(b) {
  const nome = prompt('Nome da barbearia:', b.nome);
  if (nome === null) return;
  const logo = prompt('Link do logo (https, deixe vazio para nenhum):', b.logo);
  if (logo === null) return;
  const venc = prompt('Vencimento (AAAA-MM-DD):', b.vencimento);
  if (venc === null) return;
  const senha = prompt('Nova senha de login (deixe vazio para não mudar):', '');
  if (senha === null) return;
  const corpo = { acao: 'atualizar', id: b.id, nome, logo, vencimento: venc };
  if (senha) corpo.senha = senha;
  try {
    await chamar('POST', corpo);
    msg($('lMsg2'), 'Barbearia atualizada.', true);
    await carregar();
  } catch (e) { msg($('lMsg2'), e.message); }
}

// ---------- cadastro ----------
$('btnCadastrar').onclick = async () => {
  const b = $('btnCadastrar'); b.disabled = true; msg($('cMsg'), '');
  try {
    const r = await chamar('POST', {
      acao: 'cadastrar',
      nome: $('cNome').value,
      email: $('cEmail').value,
      senha: $('cSenha').value,
      logo: $('cLogo').value,
      dias: $('cDias').value
    });
    msg($('cMsg'), 'Cadastrada! Vencimento: ' + r.vencimento + ' — Link de agendamento: ' + r.link, true);
    ['cNome', 'cEmail', 'cSenha', 'cLogo'].forEach((i) => ($(i).value = ''));
    $('cDias').value = 7;
    await carregar();
  } catch (e) { msg($('cMsg'), e.message); }
  b.disabled = false;
};
</script>
</body>
</html>
