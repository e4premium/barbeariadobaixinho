<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administração — Barbearias</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --txt:#1c1e21; --mut:#6b7280; --bd:#d9dce1; --pri:#1f6feb; --ok:#1a7f37; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --txt:#e8eaed; --mut:#9aa0aa; --bd:#323741; --pri:#4c8dff; --ok:#3fb950; --err:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width: 980px; margin: 0 auto; padding: 20px 14px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--bd); border-radius:7px; background:var(--bg); color:var(--txt); font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap:12px; }
  button { padding:9px 16px; border:0; border-radius:7px; background:var(--pri); color:#fff; font-size:14px; cursor:pointer; }
  button.sec { background:transparent; color:var(--txt); border:1px solid var(--bd); }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:12px; font-size:14px; word-break: break-all; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .topo { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }
  .topo h1 { margin:0; }
  .tabela { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--bd); vertical-align:middle; }
  th { font-size:12px; color:var(--mut); font-weight:600; }
  .venc-ok { color:var(--ok); } .venc-x { color:var(--err); font-weight:600; }
  .acoes { display:flex; gap:6px; flex-wrap:wrap; }
  .acoes button { padding:5px 10px; font-size:13px; }
  .mut { color:var(--mut); font-size:13px; }
  #login { max-width:380px; margin: 60px auto; }
  .oculto { display:none; }
</style>
</head>
<body>
<main>

  <!-- LOGIN -->
  <section id="login" class="card">
    <h1>Administração</h1>
    <div style="margin-bottom:12px"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div style="margin-bottom:12px"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password"></div>
    <button id="btnEntrar">Entrar</button>
    <div id="lMsg" class="msg err"></div>
  </section>

  <!-- PAINEL -->
  <section id="painel" class="oculto">
    <div class="topo">
      <h1>Barbearias</h1>
      <button class="sec" id="btnSair">Sair</button>
    </div>

    <div class="card">
      <h2>Cadastrar nova barbearia</h2>
      <div class="grid">
        <div><label for="cNome">Nome da barbearia</label><input id="cNome" maxlength="80"></div>
        <div><label for="cEmail">E-mail de login</label><input id="cEmail" type="email"></div>
        <div><label for="cSenha">Senha (mín. 6)</label><input id="cSenha" type="text" autocomplete="off"></div>
        <div><label for="cLogo">Link do logo (https, opcional)</label><input id="cLogo" type="url" placeholder="https://..."></div>
        <div><label for="cDias">Dias de teste</label><input id="cDias" type="number" min="0" max="365" value="7"></div>
      </div>
      <div style="margin-top:14px"><button id="btnCadastrar">Cadastrar</button></div>
      <div id="cMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Barbearias cadastradas</h2>
      <div class="tabela">
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Vencimento</th><th>Link</th><th></th></tr></thead>
          <tbody id="lista"><tr><td colspan="5" class="mut">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div id="lMsg2" class="msg"></div>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
// COLE AQUI a mesma configuração web do Firebase que já está no seu public/index.html
const firebaseConfig = {
  apiKey: "AIzaSyA0fZrksbEj3WIDmNHXRdE9o8pbTWnySwM",
  authDomain: "barbearia-d51ac.firebaseapp.com",
  projectId: "barbearia-d51ac"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API = '/.netlify/functions/admin-barbearias';
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function msg(el, texto, ok) { el.textContent = texto || ''; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

async function chamar(metodo, corpo) {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(API, {
    method: metodo,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || 'Erro ' + r.status);
  return dados;
}

// ---------- login ----------
$('btnEntrar').onclick = async () => {
  const b = $('btnEntrar'); b.disabled = true; msg($('lMsg'), '');
  try {
    await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lSenha').value);
  } catch (e) {
    msg($('lMsg'), 'E-mail ou senha incorretos.');
  }
  b.disabled = false;
};
$('lSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnEntrar').click(); });
$('btnSair').onclick = () => auth.signOut();

auth.onAuthStateChanged(async (u) => {
  if (!u) { $('painel').classList.add('oculto'); $('login').classList.remove('oculto'); return; }
  try {
    await carregar();
    $('login').classList.add('oculto'); $('painel').classList.remove('oculto');
  } catch (e) {
    await auth.signOut();
    msg($('lMsg'), e.message === 'Acesso negado.' ? 'Esta conta não tem acesso à administração.' : e.message);
  }
});

// ---------- lista ----------
function hoje() { return new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10); }

async function carregar() {
  const { barbearias } = await chamar('GET');
  const tb = $('lista');
  if (!barbearias.length) { tb.innerHTML = '<tr><td colspan="5" class="mut">Nenhuma barbearia cadastrada.</td></tr>'; return; }
  const h = hoje();
  tb.innerHTML = barbearias.map((b) => {
    const vencida = !b.vencimento || b.vencimento < h;
    const link = b.slug ? location.origin + '/agenda.html?b=' + b.slug : '';
    return `<tr data-id="${esc(b.id)}">
      <td>${esc(b.nome)}</td>
      <td>${esc(b.email)}</td>
      <td class="${vencida ? 'venc-x' : 'venc-ok'}">${esc(b.vencimento || '—')}${vencida ? ' (vencida)' : ''}</td>
      <td>${link ? `<button class="sec copiar" data-link="${esc(link)}" style="padding:4px 9px;font-size:12px">Copiar</button>` : '<span class="mut">sem slug</span>'}</td>
      <td class="acoes">
        <button class="sec editar">Editar</button>
      </td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('.copiar').forEach((btn) => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(btn.dataset.link); btn.textContent = 'Copiado!'; }
      catch (e) { prompt('Copie o link:', btn.dataset.link); }
      setTimeout(() => (btn.textContent = 'Copiar'), 1500);
    };
  });
  tb.querySelectorAll('.editar').forEach((btn) => {
    btn.onclick = () => {
      const id = btn.closest('tr').dataset.id;
      editar(barbearias.find((x) => x.id === id));
    };
  });
}

// Edição simples por caixas de diálogo
async function editar(b) {
  const nome = prompt('Nome da barbearia:', b.nome);
  if (nome === null) return;
  const logo = prompt('Link do logo (https, deixe vazio para nenhum):', b.logo);
  if (logo === null) return;
  const venc = prompt('Vencimento (AAAA-MM-DD):', b.vencimento);
  if (venc === null) return;
  const senha = prompt('Nova senha de login (deixe vazio para não mudar):', '');
  if (senha === null) return;
  const corpo = { acao: 'atualizar', id: b.id, nome, logo, vencimento: venc };
  if (senha) corpo.senha = senha;
  try {
    await chamar('POST', corpo);
    msg($('lMsg2'), 'Barbearia atualizada.', true);
    await carregar();
  } catch (e) { msg($('lMsg2'), e.message); }
}

// ---------- cadastro ----------
$('btnCadastrar').onclick = async () => {
  const b = $('btnCadastrar'); b.disabled = true; msg($('cMsg'), '');
  try {
    const r = await chamar('POST', {
      acao: 'cadastrar',
      nome: $('cNome').value,
      email: $('cEmail').value,
      senha: $('cSenha').value,
      logo: $('cLogo').value,
      dias: $('cDias').value
    });
    msg($('cMsg'), 'Cadastrada! Vencimento: ' + r.vencimento + ' — Link de agendamento: ' + r.link, true);
    ['cNome', 'cEmail', 'cSenha', 'cLogo'].forEach((i) => ($(i).value = ''));
    $('cDias').value = 7;
    await carregar();
  } catch (e) { msg($('cMsg'), e.message); }
  b.disabled = false;
};
</script>
</body>
</html>
